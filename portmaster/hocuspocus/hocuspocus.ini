# gptokeyb2 mapping for SLOPocus (Hocus Pocus).
# The game reads the DOS keys: arrows move, Up also talks/flips switches and,
# held while firing, shoots upward; Ctrl jumps, Alt fires; PgUp/PgDn look up
# and down; P pauses; Enter/Esc drive the menus (Esc opens the in-game menu).
# The port itself (SLOPOCUS_PAD_PROMPTS) names these buttons in its prompts
# and takes fire (a/y) as yes and jump (b) as no in the yes/no boxes.
# PortMaster handhelds use the Nintendo diamond: a = east, b = south,
# x = north, y = west.

[config]
deadzone_triggers = 3000
deadzone_mode = axial
deadzone = 2000
deadzone_scale = 8
mouse_delay = 16

[controls]
b = "leftctrl"
a = "leftalt"
y = "leftalt"
x = "p"

l1 = "pageup"
r1 = "pagedown"
l2 = "f2"
r2 = "f3"

start = "enter"
back = "esc"

up = "up"
down = "down"
left = "left"
right = "right"

left_analog = arrow_keys
right_analog =

hotkey = hold_state hotkey

[controls:hotkey]
overlay = parent
x = "f1"
y = "f10"
l1 = "m"
r1 = "s"
b = "v"
